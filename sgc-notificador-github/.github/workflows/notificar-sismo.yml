name: Notificar sismo a ntfy

# Este workflow NO corre en cron — se dispara bajo demanda desde el
# Cloudflare Worker (que sí revisa el feed del SGC cada minuto) mediante
# la API de GitHub (repository_dispatch). Así evitamos el problema viejo
# del cron poco confiable de GitHub Actions (llegaba a tardar 40-90 min),
# y evitamos que Cloudflare tenga que hablar directo con ntfy (que es
# donde chocábamos con el límite de la IP compartida).
on:
  repository_dispatch:
    types: [sismo-detectado]

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar a ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_URL: ${{ secrets.NTFY_URL || 'https://ntfy.sh' }}
          ID: ${{ github.event.client_payload.id }}
          MAG: ${{ github.event.client_payload.mag }}
          PLACE: ${{ github.event.client_payload.place }}
          LOCAL_TIME: ${{ github.event.client_payload.localTime }}
          DEPTH: ${{ github.event.client_payload.depth }}
          STATUS: ${{ github.event.client_payload.status }}
        run: |
          MAG_NUM=$(printf "%.1f" "$MAG")

          # Nivel de urgencia según magnitud (mismo criterio que ya
          # usábamos en el Worker de Cloudflare).
          if awk "BEGIN {exit !($MAG >= 6)}"; then
            TITULO="SISMO FUERTE - M${MAG_NUM}"
            TAGS="rotating_light,bangbang,rotating_light"
            PRIORIDAD="urgent"
          elif awk "BEGIN {exit !($MAG >= 5)}"; then
            TITULO="SISMO IMPORTANTE - M${MAG_NUM}"
            TAGS="rotating_light,warning"
            PRIORIDAD="urgent"
          elif awk "BEGIN {exit !($MAG >= 4)}"; then
            TITULO="Sismo moderado - M${MAG_NUM}"
            TAGS="warning"
            PRIORIDAD="high"
          else
            TITULO="Sismo - M${MAG_NUM}"
            TAGS="earth_americas"
            PRIORIDAD="default"
          fi

          ESTADO_TEXTO="$STATUS"
          if [ "$STATUS" = "manual" ]; then
            ESTADO_TEXTO="revisado por el SGC"
          fi

          CUERPO="📍 **${PLACE}**
🕒 Hora local: ${LOCAL_TIME}
⬇️ Profundidad: ${DEPTH} km
✅ Estado: ${ESTADO_TEXTO}"

          if awk "BEGIN {exit !($MAG >= 5)}"; then
            CUERPO="${CUERPO}

⚠️ _Si sentiste este sismo, repórtalo en el visor del SGC._"
          fi

          echo "Publicando sismo $ID (M$MAG_NUM) a ntfy..."

          HTTP_CODE=$(curl -s -o /tmp/ntfy_resp.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${NTFY_TOKEN}" \
            -H "Title: ${TITULO}" \
            -H "Priority: ${PRIORIDAD}" \
            -H "Tags: ${TAGS}" \
            -H "Markdown: yes" \
            -H "Actions: view, Abrir SGC, https://www.sgc.gov.co/sismos" \
            -d "${CUERPO}" \
            "${NTFY_URL}/${NTFY_TOPIC}")

          echo "Código HTTP: $HTTP_CODE"
          cat /tmp/ntfy_resp.txt

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Notificado correctamente: $ID"
          else
            echo "❌ Falló la notificación de $ID (HTTP $HTTP_CODE)"
            exit 1
          fi
